name: Build iOS (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Still Alive upstream
        uses: actions/checkout@v4
        with:
          repository: Eideren/Mirror-s-Edge
          lfs: true
          path: game

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Apply overlay
        run: |
          rsync -a overlay/overlay/ game/
          cp overlay/overlay/PORT.md game/PORT.md
          bash overlay/tools/ci-split-assemblies.sh game

      - name: Commit overlay for game-ci
        working-directory: game
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "Apply mobile/iOS overlay"

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          unityVersion: 2022.3.5f1
          targetPlatform: iOS
          buildsPath: build
          buildMethod: StillAliveBuild.BuildIosUnsigned
          customParameters: -nographics -batchmode -maxParallelJobs 1 -disable-assembly-updater

      - name: Upload Unity logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            game/Logs
            ~/.local/share/unity3d/Editor.log
          if-no-files-found: ignore

      - name: Xcode build (no code sign)
        working-directory: game
        run: |
          set -euo pipefail
          PROJECT=$(find ../build/iOS -name '*.xcodeproj' -maxdepth 2 | head -1)
          xcodebuild -project "$PROJECT" -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/DerivedData CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Create unsigned IPA
        run: |
          APP=$(find build/DerivedData -name '*.app' -type d | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr StillAlive-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StillAlive-iOS-unsigned
          path: StillAlive-unsigned.ipa
