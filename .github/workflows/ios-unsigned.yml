# Unsigned iOS needs macOS + Xcode. The full Unity project does not compile on GitHub's
# free macos-14 runners (Roslyn OOM). Paid macos-14-xlarge is optional, not required for Android.
# Full pipeline kept in ios-unsigned.yml.archive for anyone with Mac access later.

name: iOS IPA (info only)

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Why there is no free iPhone build here
        run: |
          cat <<'EOF'
          iPhone (.ipa) from Unity ALWAYS needs Apple macOS + Xcode at some point.
          You do NOT need a Mac at home for Android — use "Build Android APK (unsigned)" (Linux, free).

          This repo's iOS CI on free GitHub Mac runners fails: ~2,400 C# scripts exhaust compiler RAM.
          Fixes that cost money (macos-14-xlarge) or need a real Mac (build once locally).

          Practical options without spending on runners:
            • Android APK via GitHub Actions (recommended)
            • Play Still Alive on Windows (Unity / upstream project)
            • Someday: WebGL in browser on a phone (not set up yet)

          If you ever get ANY Mac (friend, school, old laptop): open the Unity project,
          File → Build Settings → iOS, then Xcode archive. See BUILD-WITHOUT-MAC.md.
          EOF
